name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - migrate/python3
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libsdl2-2.0-0 \
            libgstreamer-plugins-base1.0-0 libwebkit2gtk-4.1-0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv run pyinstaller etipitaka.spec --noconfirm --clean

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          tar -czf ../e-tipitaka-${{ matrix.os }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-tipitaka-${{ matrix.os }}
          path: e-tipitaka-${{ matrix.os }}.tar.gz
          retention-days: 14
