# GitLab CI mirror of .github/workflows/build.yml — used because the GitHub
# LFS bandwidth quota (1 GB/mo) is exhausted. GitLab gives 10 GB free.

stages:
  - build
  - package

variables:
  GIT_LFS_SKIP_SMUDGE: "0"   # always fetch LFS objects on checkout
  PYTHON_VERSION: "3.12"

# ---------------------------------------------------------------------------
# Windows .exe (PyInstaller one-file)
# Uses GitLab's SaaS Windows shared runner. Free tier requires an account
# with a verified payment method on file (no charge for free minutes).
# ---------------------------------------------------------------------------
build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 1h
  before_script:
    - git lfs install
    - git lfs pull
    - python -m pip install --upgrade pip uv
  script:
    - uv sync --python $env:PYTHON_VERSION
    - uv run pyinstaller etipitaka.spec --noconfirm --clean
  artifacts:
    name: "e-tipitaka-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days

# ---------------------------------------------------------------------------
# Linux folder build — small, fast, useful smoke test of the spec file.
# Uses ubuntu:24.04 (ships python 3.12) so we can pull the wxPython 4.2.5
# prebuilt wheel from extras.wxpython.org — wxPython has no manylinux wheel
# on PyPI and the python:3.12 (debian) image was forced to compile from
# sdist (~45 min, needed full GTK -dev headers).
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
    WX_WHEEL_URL: "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp312-cp312-linux_x86_64.whl"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        python3.12 python3.12-venv python3-pip
        git git-lfs ca-certificates curl
        build-essential pkg-config libcairo2-dev
        libgtk-3-0 libnotify4 libsdl2-2.0-0
        libgstreamer-plugins-base1.0-0 libwebkit2gtk-4.1-0
        libsm6 libxtst6
    - git lfs install --force   # ubuntu apt-installed git-lfs leaves a pre-push hook
    - git lfs pull
    - pip install --break-system-packages uv
  script:
    - uv venv --python python3.12
    - . .venv/bin/activate
    - uv pip install "$WX_WHEEL_URL"
    - uv pip install pony xhtml2pdf Pillow appdirs packaging requests pyinstaller
    - pyinstaller etipitaka.spec --noconfirm --clean
  artifacts:
    name: "e-tipitaka-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days
  allow_failure: true   # windows is the real release; linux is a smoke test
