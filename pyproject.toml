[project]
name = "e-tipitaka"
version = "3.2.1"
description = "Thai Tipitaka reader"
requires-python = ">=3.12"
dependencies = [
    "wxPython>=4.2.1",
    "pony>=0.7.19",
    "xhtml2pdf>=0.2.16",
    "Pillow>=10.0",
    "appdirs>=1.4.4",
    "packaging>=23.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pylint>=3.0", "pyinstaller>=6.0"]

[tool.uv]
package = false
